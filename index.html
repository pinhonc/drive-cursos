<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#141112">
<title>Academia Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lobster&family=Open+Sans:wght@400;600;700&family=Roboto+Slab:wght@700;800&display=swap">
<style>
/* Layout: quadro de cardápio de diner — fundo carvão, placas vermelhas com letreiro script, títulos slab mostarda, faixa xadrez */
:root{
  --board:#1d191a; --panel:#282324; --panel-2:#332d2e; --line:#463d3e;
  --red:#981e28; --red-hi:#c42a33; --mustard:#f6a42f; --mustard-deep:#d7891a;
  --cream:#f4ead8; --muted:#bcae9e; --ink:#141112;
  --ok:#43b88c; --bad:#e5574f;
  --opt-a:#c42a33; --opt-b:#f6a42f; --opt-c:#1f9a92; --opt-d:#e8dbc2;
  --font-script:'Lobster','Brush Script MT',cursive;
  --font-slab:'Roboto Slab',Rockwell,'Courier New',Georgia,serif;
  --font-body:'Open Sans','Segoe UI',system-ui,sans-serif;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--board);color:var(--cream);margin:0}
body{font-family:var(--font-body);font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--mustard);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
p{margin:0}
.wrap{max-width:1120px;margin:0 auto;padding-inline:16px}
.num{font-variant-numeric:tabular-nums}

/* faixa xadrez do cardápio */
.checker{height:20px;background:repeating-conic-gradient(var(--mustard) 0 25%,var(--ink) 0 50%) 0 0/20px 20px}
.checker.fino{height:10px;background-size:10px 10px}

/* placa de seção (como "Sanduíches" no cardápio) */
.plate{display:inline-block;background:var(--red);padding:.05em .55em .18em;border-radius:3px;
  font-family:var(--font-script);font-weight:400;color:var(--mustard);letter-spacing:.01em;
  -webkit-text-stroke:5px var(--ink);paint-order:stroke fill;text-shadow:3px 3px 0 var(--ink);line-height:1.15}
.plate.lg{font-size:clamp(30px,5vw,44px)}
.plate.md{font-size:clamp(24px,3.6vw,32px);-webkit-text-stroke:4px var(--ink)}
.sec-head{display:flex;align-items:center;gap:14px;margin:34px 0 16px}
.sec-head::after{content:"";flex:1;height:2px;background:var(--mustard);opacity:.75}
.eyebrow{font-family:var(--font-slab);font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mustard)}

/* demo */
.demo-bar{background:var(--mustard);color:var(--ink);font-size:13px;padding:6px 16px;text-align:center;font-weight:600}
.demo-bar code{background:rgba(0,0,0,.12);padding:0 5px;border-radius:4px;font-family:var(--font-slab)}

/* topo */
.topbar{background:var(--ink);border-bottom:2px solid var(--red)}
.topbar .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left}
.brand-logo{height:46px;width:auto;display:none}
.tem-logo .brand-logo{display:block}
.wm{display:flex;flex-direction:column;line-height:1}
.wm-script{font-family:var(--font-script);font-size:28px;color:var(--cream);text-shadow:2px 2px 0 var(--red)}
.tem-logo .topbar .wm-script{display:none}
.wm-sub{font-family:var(--font-slab);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--mustard);margin-top:4px}
.topbar .grow{flex:1}
.who{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);min-width:0}
.who b{color:var(--cream);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:180px}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
  padding:3px 9px;border-radius:999px;background:var(--panel-2);color:var(--muted);white-space:nowrap}
.chip.red{background:var(--red);color:var(--cream)}
.chip.ok{background:color-mix(in srgb,var(--ok) 22%,transparent);color:var(--ok)}
.chip.bad{background:color-mix(in srgb,var(--bad) 20%,transparent);color:#ff8d86}
.chip.gold{background:color-mix(in srgb,var(--mustard) 20%,transparent);color:var(--mustard)}

/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:8px;padding:11px 18px;
  font-family:var(--font-slab);font-weight:700;font-size:15px;letter-spacing:.01em;transition:transform .12s,filter .12s,background .12s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--mustard);color:var(--ink);box-shadow:0 3px 0 var(--mustard-deep)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-red{background:var(--red-hi);color:var(--cream);box-shadow:0 3px 0 #6e141c}
.btn-ghost{background:transparent;color:var(--cream);border:1.5px solid var(--line)}
.btn-ghost:hover{border-color:var(--mustard);color:var(--mustard)}
.btn-link{background:none;border:0;color:var(--mustard);font-weight:600;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn-sm{padding:7px 12px;font-size:13px}

/* formulários */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--muted)}
.input{width:100%;background:var(--board);border:1.5px solid var(--line);border-radius:8px;padding:11px 13px;font-size:16px;color:var(--cream)}
.input:focus{border-color:var(--mustard);outline:none}
.input.pin{letter-spacing:.5em;font-family:var(--font-slab);font-weight:700}
.form{display:flex;flex-direction:column;gap:14px}
.form-err{color:#ff8d86;font-size:14px;font-weight:600;min-height:1.2em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* login */
.login{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding-block:48px 56px}
.login-hero{min-width:0}
.login-hero .wm-script{font-size:clamp(46px,7vw,76px);text-shadow:4px 4px 0 var(--red)}
.login-hero .logo-big{display:none;max-width:260px;margin-bottom:8px}
.tem-logo .login-hero .logo-big{display:block}
.tem-logo .login-hero .wm-script{display:none}
.login-hero h1{margin-top:14px}
.login-hero .lead{color:var(--muted);font-size:17px;max-width:46ch;margin-top:18px}
.menu-list{margin-top:26px;display:flex;flex-direction:column;gap:12px;max-width:440px}
.menu-item{display:flex;align-items:baseline;gap:10px;border-bottom:1.5px solid var(--mustard);padding-bottom:6px}
.menu-item .mi-name{font-family:var(--font-slab);font-weight:700;color:var(--mustard);font-size:17px}
.menu-item .mi-desc{font-size:13px;color:var(--muted)}
.menu-item .mi-val{margin-left:auto;font-family:var(--font-slab);font-weight:700;color:var(--cream);white-space:nowrap}
.card{background:var(--panel);border-radius:14px;padding:24px;border:1px solid var(--line)}
.tabs{display:flex;gap:4px;background:var(--board);border-radius:10px;padding:4px;margin-bottom:18px}
.tab{flex:1;border:0;background:transparent;padding:9px 10px;border-radius:7px;font-family:var(--font-slab);font-weight:700;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--red);color:var(--cream)}
.login-foot{margin-top:14px;text-align:center}

/* home */
.hello{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:18px;padding-top:30px}
.hello h1{font-family:var(--font-slab);font-weight:800;font-size:clamp(26px,4vw,36px)}
.hello h1 span{color:var(--mustard)}
.hello p{color:var(--muted);margin-top:6px}
.score-strip{display:flex;gap:10px;flex-wrap:wrap}
.score-box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;min-width:130px}
.score-box .k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.score-box .v{font-family:var(--font-slab);font-weight:800;font-size:24px;color:var(--mustard)}

.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:20px}
.course{background:var(--panel);border-radius:14px;overflow:hidden;border:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.course-cover{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--ink)}
.course-cover img{width:100%;height:100%;object-fit:cover;display:block}
.course-cover .chip{position:absolute;top:12px;left:12px}
.course-body{padding:18px 20px 20px;display:flex;flex-direction:column;gap:12px;flex:1}
.course-title{font-family:var(--font-slab);font-weight:800;font-size:21px;color:var(--mustard);border-bottom:1.5px solid var(--mustard);padding-bottom:6px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px}
.course-title .best{margin-left:auto;font-size:15px;color:var(--cream);white-space:nowrap}
.course-sub{color:var(--muted);font-size:14px}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.meta b{color:var(--cream)}
.progress{height:6px;background:var(--board);border-radius:99px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--mustard);border-radius:99px;transition:width .4s}
.course-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:auto;padding-top:4px}
.course-actions .btn{flex:1;min-width:150px}
.hint{font-size:12px;color:var(--muted)}

/* ranking em estilo cardápio */
.rank-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.pill{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:6px 14px;font-size:13px;font-weight:700;color:var(--muted)}
.pill[aria-pressed="true"]{background:var(--mustard);border-color:var(--mustard);color:var(--ink)}
.rank-list{display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 18px}
.rk{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.rk:last-child{border-bottom:0}
.rk .pos{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-slab);font-weight:800;font-size:14px;background:var(--panel-2);color:var(--muted)}
.rk.p1 .pos{background:var(--mustard);color:var(--ink)}
.rk.p2 .pos{background:#d9d2c5;color:var(--ink)}
.rk.p3 .pos{background:#b9763a;color:var(--ink)}
.rk .nm{font-family:var(--font-slab);font-weight:700;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk .st{font-size:12px;color:var(--muted)}
.rk .pts{font-family:var(--font-slab);font-weight:800;color:var(--mustard);font-size:17px;text-align:right}
.rk .pts small{display:block;font-size:11px;font-weight:600;color:var(--muted);font-family:var(--font-body)}
.rk.me .nm{color:var(--mustard)}
.rk.me{background:linear-gradient(90deg,color-mix(in srgb,var(--red) 35%,transparent),transparent);margin-inline:-18px;padding-inline:18px;border-radius:6px}
.empty{padding:22px 4px;color:var(--muted);text-align:center}

.two-col{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:24px;align-items:start}
.hist{width:100%;border-collapse:collapse;font-size:14px}
.hist th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:8px 6px;border-bottom:1.5px solid var(--mustard)}
.hist td{padding:9px 6px;border-bottom:1px solid var(--line)}
.table-scroll{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 14px}

/* estudo */
.study-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-top:22px}
.study-top h1{font-family:var(--font-slab);font-weight:800;font-size:clamp(20px,3vw,26px);flex:1;min-width:0}
.slide-stage{margin-top:16px;display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px;align-items:start}
.slide-frame{background:var(--ink);border-radius:12px;overflow:hidden;aspect-ratio:16/9;max-width:100%;border:1px solid var(--line)}
.slide-frame img{width:100%;height:100%;object-fit:contain;display:block}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;gap:12px}
.note h2{font-family:var(--font-slab);font-weight:800;font-size:20px;color:var(--mustard)}
.note p{color:var(--cream);font-size:15px;line-height:1.6}
.note .count{font-family:var(--font-slab);font-weight:700;color:var(--muted);font-size:13px}
.slide-nav{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
.slide-nav .btn{flex:1}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding:14px 2px 6px;margin-top:6px}
.thumb{flex:0 0 auto;width:96px;aspect-ratio:16/9;border-radius:6px;overflow:hidden;border:2px solid transparent;padding:0;background:var(--ink);position:relative;opacity:.55}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb.seen{opacity:.85}
.thumb[disabled]{opacity:.25;cursor:not-allowed}
.thumb[aria-current="true"]{border-color:var(--mustard);opacity:1}
.thumb span{position:absolute;bottom:2px;right:4px;font-size:10px;font-weight:800;color:var(--cream);text-shadow:0 1px 2px #000}

/* quiz */
.quiz{padding-block:22px 40px;max-width:980px;margin:0 auto}
.q-head{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.q-head .q-course{font-family:var(--font-slab);font-weight:700;color:var(--muted);font-size:14px;flex:1;min-width:0}
.q-score{font-family:var(--font-slab);font-weight:800;font-size:22px;color:var(--mustard)}
.q-dots{display:flex;gap:4px;margin-top:12px}
.q-dots i{flex:1;height:6px;border-radius:99px;background:var(--panel-2)}
.q-dots i.ok{background:var(--ok)}
.q-dots i.bad{background:var(--bad)}
.q-dots i.cur{background:var(--mustard)}
.q-main{display:grid;grid-template-columns:auto minmax(0,1fr);gap:20px;align-items:center;margin-top:26px}
.timer{position:relative;width:78px;height:78px}
.timer svg{width:100%;height:100%;transform:rotate(-90deg)}
.timer .bg{stroke:var(--panel-2)}
.timer .fg{stroke:var(--mustard);transition:stroke-dashoffset .25s linear,stroke .3s}
.timer.low .fg{stroke:var(--red-hi)}
.timer b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--font-slab);font-weight:800;font-size:24px}
.q-text{font-family:var(--font-slab);font-weight:700;font-size:clamp(20px,3vw,28px);line-height:1.3}
.q-num{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--mustard);margin-bottom:6px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:24px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:0;border-radius:12px;padding:18px 18px;min-height:84px;
  font-weight:700;font-size:16px;line-height:1.35;color:var(--cream);box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .12s,opacity .25s,filter .2s}
.opt:hover:not([disabled]){transform:translateY(-2px);filter:brightness(1.07)}
.opt .shape{flex:0 0 34px;height:34px;display:grid;place-items:center;border-radius:8px;background:rgba(0,0,0,.18)}
.opt .shape svg{width:20px;height:20px}
.opt.a{background:var(--opt-a)}
.opt.b{background:var(--opt-b);color:var(--ink)}
.opt.c{background:var(--opt-c)}
.opt.d{background:var(--opt-d);color:var(--ink)}
.opt[disabled]{cursor:default}
.opts.done .opt{opacity:.35}
.opts.done .opt.right{opacity:1;outline:4px solid var(--ok);outline-offset:3px}
.opts.done .opt.picked.wrong{opacity:.9;outline:4px solid var(--bad);outline-offset:3px}
.opt .mark{margin-left:auto;font-size:22px;font-weight:800}

.feedback{margin-top:24px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.fb-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:10px}
.fb-title{font-family:var(--font-script);font-size:34px;line-height:1.1}
.fb-title.ok{color:var(--ok)}
.fb-title.bad{color:#ff8d86}
.fb-pts{font-family:var(--font-slab);font-weight:800;font-size:18px;color:var(--mustard)}
.fb-exp{color:var(--cream)}
.fb-ref{font-size:13px;color:var(--muted)}
.live-rank{position:relative;transition:height .3s}
.live-rank .rk{position:absolute;left:0;right:0;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .4s;margin:0}
.live-rank .rk{padding-inline:8px}
.live-rank .rk.me{margin-inline:0;padding-inline:8px}
.next-row{display:flex;justify-content:flex-end;margin-top:18px}

.intro{max-width:640px;margin:30px auto 0;text-align:left}
.rules{display:flex;flex-direction:column;gap:0;margin:18px 0 24px}
.rules .menu-item{padding-block:10px 8px}

/* resultado */
.result{padding-block:30px 50px}
.result-hero{display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center}
.big-pct{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;text-align:center;background:var(--panel);border:6px solid var(--mustard)}
.big-pct.fail{border-color:var(--red-hi)}
.big-pct b{font-family:var(--font-slab);font-weight:800;font-size:44px;line-height:1}
.big-pct span{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.result-hero h1{font-family:var(--font-script);font-weight:400;font-size:clamp(38px,6vw,56px);color:var(--mustard);line-height:1.05}
.result-hero h1.fail{color:var(--cream)}
.result-hero p{color:var(--muted);margin-top:8px;font-size:16px}
.result-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.review{display:flex;flex-direction:column;gap:10px}
.rv{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:10px;padding:14px 16px}
.rv h3{font-family:var(--font-slab);font-size:15px;font-weight:700}
.rv p{font-size:14px;margin-top:6px;color:var(--muted)}
.rv p b{color:var(--cream)}
.save-state{font-size:13px;color:var(--muted);margin-top:10px}

/* celebração */
.party{position:fixed;inset:0;z-index:50;background:radial-gradient(ellipse at center,#3a1014 0%,var(--ink) 70%);display:grid;place-items:center;overflow:hidden}
.party canvas{position:absolute;inset:0;width:100%;height:100%}
.party-inner{position:relative;text-align:center;padding:24px}
.neon{font-family:var(--font-script);font-size:clamp(64px,14vw,150px);color:#fff6e4;line-height:1;
  text-shadow:0 0 6px #fff,0 0 18px var(--mustard),0 0 42px var(--mustard),0 0 80px var(--red-hi);animation:flicker 2.4s infinite}
.party-sub{font-family:var(--font-slab);font-weight:700;font-size:clamp(17px,2.4vw,22px);color:var(--cream);margin-top:14px}
.party .checker{position:absolute;left:0;right:0;height:28px;background-size:28px 28px}
.party .checker.top{top:0}
.party .checker.bot{bottom:0}
.party .btn{margin-top:26px}
@keyframes flicker{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.55}}

/* gestor */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .k{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.kpi .v{font-family:var(--font-slab);font-weight:800;font-size:28px;color:var(--mustard);margin-top:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar .input{width:auto;padding:8px 12px;font-size:14px}
.gt{width:100%;border-collapse:collapse;font-size:14px;min-width:1180px}
.gt th{text-align:left;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 8px;border-bottom:1.5px solid var(--mustard);white-space:nowrap}
.gt td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.gt td.nm{font-family:var(--font-slab);font-weight:700}
.pinform{display:flex;gap:6px;align-items:center}
.pinform .input{width:90px;padding:6px 8px;font-size:14px}
.miss{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.miss-item{padding:10px 0;border-bottom:1px solid var(--line)}
.miss-item:last-child{border-bottom:0}
.miss-item .mq{font-size:14px}
.miss-bar{display:flex;align-items:center;gap:10px;margin-top:6px}
.miss-bar .track{flex:1;height:8px;background:var(--board);border-radius:99px;overflow:hidden}
.miss-bar .track i{display:block;height:100%;background:var(--red-hi);border-radius:99px}
.miss-bar span{font-family:var(--font-slab);font-weight:700;font-size:13px;color:var(--cream);min-width:92px;text-align:right}

.foot{margin-top:56px}
.foot .wrap{padding-block:14px 26px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--cream);color:var(--ink);
  padding:10px 18px;border-radius:999px;font-weight:700;font-size:14px;z-index:60;box-shadow:0 6px 24px rgba(0,0,0,.4)}

@media (max-width:1000px){
  .miss{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .login{grid-template-columns:1fr;gap:28px;padding-block:28px 40px}
  .two-col,.slide-stage,.feedback,.miss{grid-template-columns:minmax(0,1fr)}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:560px){
  .opts{grid-template-columns:minmax(0,1fr)}
  .opt{min-height:64px;padding:14px}
  .q-main{grid-template-columns:minmax(0,1fr)}
  .timer{width:64px;height:64px;order:-1}
  .result-hero{grid-template-columns:minmax(0,1fr)}
  .big-pct{width:120px;height:120px}
  .row2{grid-template-columns:minmax(0,1fr)}
  .who .chip{display:none}
  .score-strip{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
  .score-box{min-width:0;padding:10px 12px}
  .score-box .v{font-size:20px}
  .course-actions .btn{min-width:0}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
}

/* gestor: cadastro e acesso */
.card-title{font-family:var(--font-slab);font-weight:800;font-size:22px;margin-bottom:16px}
.cad-form{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,.8fr) auto;gap:12px;align-items:end}
.cad-form .cad-msg{grid-column:1/-1;min-height:0;margin:0}
.cad-form .cad-msg:empty{display:none}
.cad-msg.ok{color:var(--ok)}
.gt select.input{width:auto;padding:6px 8px;font-size:13px}
.gt tr.off td{opacity:.55}
.gt tr.off td:last-child{opacity:1}
.chk{display:inline-flex;align-items:center;gap:6px;margin-left:8px}
@media (max-width:760px){.cad-form{grid-template-columns:minmax(0,1fr)}}

/* tela cheia dos slides */
.ico{width:16px;height:16px;flex:0 0 auto}
.slide-frame{display:block;width:100%;padding:0;cursor:zoom-in;position:relative;color:inherit;font:inherit}
.slide-frame .fs-hint{position:absolute;right:10px;bottom:10px;display:inline-flex;align-items:center;gap:6px;background:rgba(20,17,18,.78);color:var(--cream);
  font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;opacity:0;transition:opacity .2s}
.slide-frame:hover .fs-hint,.slide-frame:focus-visible .fs-hint{opacity:1}
@media (hover:none){.slide-frame .fs-hint{opacity:1}}
body.fs-aberto{overflow:hidden}
.fs{position:fixed;inset:0;z-index:70;background:#000;display:grid;place-items:center;overflow:hidden;touch-action:pan-y}
.fs-img{width:100vw;height:100vh;height:100dvh;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.fs-btn{position:absolute;border:0;background:rgba(20,17,18,.6);color:#fff;display:grid;place-items:center;border-radius:999px;cursor:pointer;transition:background .15s,opacity .15s}
.fs-btn:hover{background:rgba(20,17,18,.88)}
.fs-btn[disabled]{opacity:.2;cursor:default}
.fs-close{top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:44px;height:44px;font-size:20px}
.fs-prev,.fs-next{top:50%;transform:translateY(-50%);width:52px;height:52px;font-size:34px;line-height:1;padding-bottom:4px}
.fs-prev{left:calc(10px + env(safe-area-inset-left,0px))}
.fs-next{right:calc(10px + env(safe-area-inset-right,0px));background:var(--mustard);color:var(--ink)}
.fs-next:hover{background:var(--mustard);filter:brightness(1.08)}
.fs-bar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;
  background:rgba(20,17,18,.82);color:var(--cream);padding:8px 10px 8px 16px;border-radius:999px;max-width:calc(100vw - 24px)}
.fs-count{font-family:var(--font-slab);font-weight:800;color:var(--mustard);white-space:nowrap}
.fs-title{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.fs-bar .btn{white-space:nowrap}
.fs-note{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom,0px));width:min(720px,calc(100vw - 24px));
  background:rgba(20,17,18,.92);color:var(--cream);border:1px solid var(--line);border-radius:12px;padding:14px 18px;font-size:15px;line-height:1.55;max-height:40vh;overflow:auto}
.fs-progress{position:absolute;left:0;right:0;top:0;height:4px;background:rgba(255,255,255,.12)}
.fs-progress i{display:block;height:100%;background:var(--mustard);transition:width .3s}
@media (max-width:560px){
  .fs-title{display:none}
  .fs-prev,.fs-next{width:44px;height:44px;font-size:28px}
}
.fs-rotate{display:none;position:absolute;top:calc(16px + env(safe-area-inset-top,0px));left:16px;align-items:center;gap:6px;background:rgba(20,17,18,.8);color:var(--cream);font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px}
@media (orientation:portrait) and (max-width:600px){.fs-rotate{display:inline-flex}}

  {

    slides: [
      { img: 'slides/atendimento/01.jpg', t: 'Passo a passo do atendimento de excelência', n: 'Um guia prático para encantar nossos clientes. Ao final, faça a avaliação: 80% de acertos aprova.' },
      { img: 'slides/atendimento/02.jpg', t: 'A nossa essência', n: 'Inaugurado em 1978, o Drive In Burger é referência. A famosa maionese foi criada pela Dona Benvinda, uma das fundadoras: é nossa marca registrada e uma receita original, segredo de família. Mantemos a tradição da comida afetiva, com um sabor que traz lembranças de momentos felizes.' },
      { img: 'slides/atendimento/03.jpg', t: 'O mapa da jornada do cliente', n: '1. Recepção (acolhimento e acomodação) → 2. Sistema digital (navegação e pedidos pelo tablet) → 3. Entrega do pedido (cuidado, gentileza e precisão) → 4. Fechamento (pagamento ágil e despedida).' },
      { img: 'slides/atendimento/04.jpg', t: 'Passo 1 · A recepção perfeita', n: 'Abordagem: “Olá, seja bem-vindo ao Drive! Mesa para quantas pessoas? Tem preferência por alguma mesa?”. Assim que o cliente sentar, entregue o Jogo Americano. Famílias: ofereça o kit infantil (tablet de atividades, desenho para colorir e giz de cera) e lembre do painel interativo no espaço kids.' },
      { img: 'slides/atendimento/05.jpg', t: 'Passo 2 · Dominando o sistema digital', n: 'Pergunte se já conhecem o sistema digital. Se SIM: lembre as seções “Preciso de Auxílio” e “Meu Pedido” e a lixeirinha do carrinho. Se NÃO: mostre fotos e descrições, ensine a caneta (alterar) e a lixeira (excluir), reforce a Regra de Ouro (pedidos da mesa enviados JUNTOS) e a conferência em “Meu Pedido”. Pagamento: pelo tablet ou no Totem, ao lado do caixa. Encerramento: “Boa refeição! Bom lanche!”.' },

      { img: 'slides/atendimento/07.jpg', t: 'Passo 4 · Fechamento e extensão da experiência', n: 'Pagamento ágil: o cliente escolhe fechar a conta pelo tablet na mesa (mais conforto) ou no Totem de autoatendimento (mais agilidade).' },

      { id: 'at02', p: 'Quem criou a famosa maionese do Drive In?', o: ['Dona Benvinda, uma das fundadoras', 'O primeiro chapeiro da casa', 'Um chef convidado na inauguração', 'A consultoria que montou o cardápio'], e: 'A maionese foi criada pela Dona Benvinda, uma das fundadoras. A receita original é segredo de família.', ref: 2 },
      { id: 'at03', p: 'O que a maionese representa para o Drive In?', o: ['Marca registrada e receita original, guardada como segredo de família', 'Molho comprado pronto de um fornecedor exclusivo da rede', 'Receita nova, lançada junto com a última troca de cardápio', 'Acompanhamento servido apenas nos pratos do Menu Kids'], e: 'A maionese é nossa marca registrada e um símbolo da nossa tradição desde a fundação.', ref: 2 },
      { id: 'at04', p: 'O que significa “comida afetiva” na nossa essência?', o: ['Um sabor que traz lembranças de momentos felizes para dividir com quem amamos', 'Porções bem servidas, pensadas para dividir com toda a mesa e a família', 'Receitas que mudam toda semana para surpreender quem volta à casa', 'Comida servida mais rápido que na concorrência, sem perder a qualidade'], e: 'Mantemos a tradição da comida afetiva: um sabor especial que traz lembranças de momentos felizes.', ref: 2 },
      { id: 'at05', p: 'Qual é a ordem correta da jornada do cliente?', o: ['Recepção → Sistema digital → Entrega do pedido → Fechamento', 'Sistema digital → Recepção → Fechamento → Entrega do pedido', 'Recepção → Entrega do pedido → Sistema digital → Fechamento', 'Fechamento → Recepção → Sistema digital → Entrega do pedido'], e: 'São 4 passos: recepção, sistema digital (tablet), entrega do pedido e fechamento.', ref: 3 },
      { id: 'at06', p: 'Qual é a abordagem inicial padrão na recepção?', o: ['“Olá, seja bem-vindo ao Drive! Mesa para quantas pessoas? Tem preferência por alguma mesa?”', '“Boa noite! Aguardem um momento aqui na entrada que já chamo alguém do salão para atender.”', '“Oi, tudo bem? Vocês fizeram reserva? Sem reserva hoje só conseguimos lugar no balcão.”', '“Seja bem-vindo ao Drive! Já sabem o que vão pedir hoje ou querem ver o cardápio antes?”'], e: 'A abordagem acolhe, pergunta o número de pessoas e a preferência de mesa.', ref: 4 },

      { id: 'at09', p: 'No Passo 2, qual pergunta define como você vai apresentar o tablet?', o: ['“Já conhecem o nosso sistema digital?”', '“Vão querer começar pelas bebidas?”', '“Preferem pagar no caixa ou no totem?”', '“Alguém da mesa está com pressa?”'], e: 'A resposta (sim ou não) define se você só relembra as funções ou ensina o sistema completo.', ref: 5 },
      { id: 'at10', p: 'O cliente diz que já conhece o sistema digital. O que você lembra a ele?', o: ['As seções “Preciso de Auxílio” e “Meu Pedido”, e a lixeirinha do carrinho para alterar antes de enviar', 'Nada além de desejar boa refeição: quem já conhece o sistema não precisa de lembrete', 'Como cadastrar o cartão de crédito no tablet e acumular pontos no programa de fidelidade', 'Que os pedidos de bebida são feitos com o atendente e os de comida pelo tablet da mesa'], e: 'Mesmo quem já conhece recebe o lembrete das funções básicas e da lixeirinha.', ref: 5 },
      { id: 'at11', p: 'Qual é a Regra de Ouro do sistema digital?', o: ['Os pedidos de todos da mesa são incluídos e enviados JUNTOS, para não chegarem em momentos diferentes', 'Cada pessoa da mesa envia o próprio pedido assim que escolher, para a cozinha começar antes', 'As bebidas são enviadas primeiro e os lanches depois, para tudo chegar na ordem certa', 'O atendente confere e envia o pedido no lugar do cliente, para evitar erros no tablet'], e: 'Pedidos enviados juntos chegam juntos à mesa.', ref: 5 },
      { id: 'at12', p: 'No tablet, para que servem a caneta e a lixeira?', o: ['A caneta altera um item; a lixeira exclui', 'A caneta chama o atendente; a lixeira fecha a conta', 'A caneta assina a conta; a lixeira cancela a mesa', 'A caneta deixa um elogio; a lixeira apaga o histórico'], e: 'Edição: caneta para alterar, lixeira para excluir.', ref: 5 },

      { id: 'at14', p: 'Onde fica o Totem de autoatendimento?', o: ['Ao lado do caixa', 'Na entrada, junto da recepção', 'No espaço kids', 'No mezanino'], e: 'O Totem fica ao lado do caixa. Informe isso ao apresentar as formas de pagamento.', ref: 5 },

      { id: 'at17', p: 'Por que anunciamos em voz alta o nome do prato ou bebida?', o: ['Para identificar rapidamente quem fez o pedido', 'Para a cozinha confirmar que o pedido saiu', 'Para chamar a atenção das outras mesas', 'Para conferir o preço com o cliente'], e: 'Anunciar identifica quem pediu, sem ficar perguntando item por item.', ref: 6 },

      { id: 'at20', p: 'Quais formas de fechar a conta apresentamos ao cliente?', o: ['Pelo tablet na mesa, para mais conforto, ou no Totem, para mais agilidade', 'Somente no caixa, com o atendente, para conferir a conta junto com o cliente', 'Somente pelo tablet da mesa, com cartão cadastrado no próprio sistema', 'Somente no Totem de autoatendimento, na saída, depois de devolver o tablet'], e: 'O cliente escolhe: tablet na mesa (conforto) ou Totem de autoatendimento (agilidade).', ref: 7 },

function rankingDe(db, cursoId) {
  const melhor = new Map();

    if (cursoId && t.curso !== cursoId) continue;
    const k = t.participante_id + '|' + t.curso;
    const b = melhor.get(k);
    if (!b || t.pontos > b.pontos) melhor.set(k, t);
  }
  const por = new Map();
  for (const t of melhor.values()) {
    const p = db.participantes.find(x => x.id === t.participante_id); if (!p || p.ativo === false) continue;
    const r = por.get(p.id) || { id: p.id, nome: p.nome, setor: p.setor, pontos: 0, acertos: 0, total: 0, cursos: 0, exemplo: !!p.exemplo };

function iniciarTimer() {
  const Q = S.quiz; clearInterval(Q.timer);
  Q.t0 = performance.now(); Q.restante = TEMPO_POR_PERGUNTA;
  const fg = $('#t-fg'), num = $('#t-num'), box = $('#timer'), L = 213.6;
  Q.timer = setInterval(() => {
    const el = (performance.now() - Q.t0) / 1000;
    Q.restante = Math.max(0, TEMPO_POR_PERGUNTA - el);
    fg.style.strokeDashoffset = (L * (1 - Q.restante / TEMPO_POR_PERGUNTA)).toFixed(1);

function responder(k) {
  const Q = S.quiz; if (Q.respondida === Q.i) return;
  Q.respondida = Q.i; clearInterval(Q.timer);
  const q = Q.qs[Q.i];
  const certa = k >= 0 && q.ops[k].certa;
  const ganho = certa ? Math.round(500 + 500 * (Q.restante / TEMPO_POR_PERGUNTA)) : 0;
  const antes = Q.pontos;
  Q.pontos += ganho; if (certa) Q.acertos++;

  Q.respostas.push({ q: q.id, ok: certa, t: Math.round((TEMPO_POR_PERGUNTA - Q.restante) * 10) / 10 });
  Q.erros = Q.erros || [];
  if (!certa) Q.erros.push({ q, escolhida: k >= 0 ? q.ops[k].t : null });

  const opts = $('#opts'); opts.classList.add('done');
  opts.querySelectorAll('.opt').forEach((b, j) => {
    b.disabled = true;
    if (q.ops[j].certa) { b.classList.add('right'); b.insertAdjacentHTML('beforeend', '<span class="mark">✓</span>'); }
    if (j === k) { b.classList.add('picked'); if (!certa) { b.classList.add('wrong'); b.insertAdjacentHTML('beforeend', '<span class="mark">✕</span>'); } }
  });
  const ultimo = Q.i === Q.qs.length - 1;
  const titulo = certa ? ['Na mosca!', 'Mandou bem!', 'Isso aí!', 'Perfeito!'][Q.i % 4] : k < 0 ? 'Tempo esgotado' : 'Não foi dessa vez';
  $('#fb').innerHTML = `<div class="feedback">
    <div class="fb-card">
      <div class="fb-title ${certa ? 'ok' : 'bad'}">${titulo}</div>
      <div class="fb-pts num">${certa ? '+' + fmt(ganho) + ' pts' : '+0 pts'}</div>
      <p class="fb-exp">${esc(q.e)}</p>
      ${q.ref ? `<p class="fb-ref">Reveja no slide ${q.ref}: ${esc(curso(Q.cid).slides[q.ref - 1]?.t || '')}</p>` : ''}
    </div>
    <div class="fb-card"><p class="eyebrow">Sua pontuação no ranking do curso</p><div class="live-rank" id="live-rank"></div></div>
  </div>
  <div class="next-row"><button class="btn btn-primary" id="q-next">${ultimo ? 'Ver resultado' : 'Próxima pergunta →'}</button></div>`;
  animarScore(antes, Q.pontos);
  liveRank(antes, Q.pontos);
  const nx = $('#q-next'); nx.focus({ preventScroll: true });
  nx.onclick = () => { if (ultimo) finalizar(); else { Q.i++; renderQuiz(); } };
  $('#fb').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'nearest' });
}
function animarScore(de, para) {
  const el = $('#q-score'); const t0 = performance.now();
  const step = t => { const p = Math.min(1, (t - t0) / 700); el.textContent = fmt(de + (para - de) * (1 - Math.pow(1 - p, 3))) + ' pts'; if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
function liveRank(antes, depois) {
  const Q = S.quiz, box = $('#live-rank'); if (!box) return;
  const ROW = 56, MOSTRA = 5;
  const outros = (Q.outros || []).slice(0, 30);
  const me = { id: S.user.id, nome: S.user.nome, setor: S.user.setor, me: true };
  const lista = p => [...outros.map(o => ({ ...o })), { ...me, pontos: p }].sort((a, b) => b.pontos - a.pontos || (a.me ? -1 : 1));
  const janela = l => { const mi = l.findIndex(r => r.me); const vis = l.slice(0, MOSTRA).map(r => r.id); if (mi >= MOSTRA) { vis.pop(); vis.push(me.id); } return vis; };
  const l0 = lista(antes), l1 = lista(depois);
  const all = l1;
  box.style.height = (Math.min(all.length, MOSTRA) * ROW) + 'px';
  if (!outros.length) {
    box.style.height = 'auto';
    box.innerHTML = `<p class="hint" style="padding:10px 0">Você é o primeiro neste curso. Os colegas vão entrar no ranking depois de você.</p>
      <div class="rk me" style="position:static"><span class="pos num">1</span><div style="min-width:0"><div class="nm">${esc(me.nome)}</div><div class="st">${esc(me.setor)}</div></div><div class="pts num">${fmt(depois)}</div></div>`;
    return;
  }
  const pos = (l, id) => l.findIndex(r => r.id === id);
  const vis0 = janela(l0), vis1 = janela(l1);
  const slot = (vis, id) => { const k = vis.indexOf(id); return k < 0 ? MOSTRA : k; };
  box.innerHTML = all.map(r => {
    const s0 = slot(vis0, r.id);
    const p0 = pos(l0, r.id) + 1;
    return `<div class="rk ${r.me ? 'me' : ''}" data-id="${esc(r.id)}" style="transform:translateY(${s0 * ROW}px);opacity:${vis0.includes(r.id) ? 1 : 0}">
      <span class="pos num">${p0}</span><div style="min-width:0"><div class="nm">${esc(r.nome)}</div><div class="st">${esc(r.setor)}</div></div>
      <div class="pts num">${fmt(r.me ? antes : r.pontos)}</div></div>`;
  }).join('');
  requestAnimationFrame(() => requestAnimationFrame(() => {
    box.querySelectorAll('.rk').forEach(row => {
      const id = row.dataset.id;
      row.style.transform = `translateY(${slot(vis1, id) * ROW}px)`;
      row.style.opacity = vis1.includes(id) ? 1 : 0;
      row.querySelector('.pos').textContent = pos(l1, id) + 1;
      if (row.classList.contains('me')) row.querySelector('.pts').textContent = fmt(depois);
    });
  }));
}

/* ---------- celebração */
function festa(t) {
  const reduz = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const ov = document.createElement('div'); ov.className = 'party'; ov.setAttribute('role', 'dialog'); ov.setAttribute('aria-label', 'Aprovado');
  ov.innerHTML = `<canvas></canvas><div class="checker top"></div><div class="checker bot"></div>
    <div class="party-inner"><div class="neon">Aprovado!</div>
    <p class="party-sub num">${t.acertos} de ${t.total} acertos · ${fmt(t.pontos)} pontos</p>
    <button class="btn btn-primary" id="party-ok">Ver meu resultado</button></div>`;
  document.body.appendChild(ov);
  const fechar = () => { cancelAnimationFrame(raf); ov.remove(); };
  $('#party-ok', ov).onclick = fechar; $('#party-ok', ov).focus();
  const cv = $('canvas', ov), ctx = cv.getContext('2d');
  const dpr = Math.min(2, devicePixelRatio || 1);
  const resize = () => { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; };
  resize();
  const cores = ['#f6a42f', '#c42a33', '#f4ead8', '#1f9a92', '#ffffff'];
  const ps = Array.from({ length: reduz ? 0 : 170 }, () => ({
    x: Math.random() * cv.width, y: -Math.random() * cv.height, w: (6 + Math.random() * 9) * dpr, h: (9 + Math.random() * 12) * dpr,
    vy: (1.6 + Math.random() * 3) * dpr, vx: (Math.random() - .5) * 1.6 * dpr, r: Math.random() * 6, vr: (Math.random() - .5) * .2,
    c: cores[Math.floor(Math.random() * cores.length)], xadrez: Math.random() < .14
  }));
  let raf;
  const tick = () => {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (const p of ps) {
      p.y += p.vy; p.x += p.vx + Math.sin(p.y / (40 * dpr)) * .6 * dpr; p.r += p.vr;
      if (p.y > cv.height + 20) { p.y = -20; p.x = Math.random() * cv.width; }
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r);
      if (p.xadrez) {
        const s = p.w * .8;
        for (let a = 0; a < 3; a++) for (let b = 0; b < 3; b++) { ctx.fillStyle = (a + b) % 2 ? '#141112' : '#f6a42f'; ctx.fillRect(-1.5 * s + a * s, -1.5 * s + b * s, s, s); }
      } else { ctx.fillStyle = p.c; ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); }
      ctx.restore();
    }
    raf = requestAnimationFrame(tick);
  };
  if (!reduz) tick();
}

  const todos = dados.participantes, ts = dados.tentativas;
  const ps = todos.filter(p => p.ativo !== false);
  const inativos = todos.length - ps.length;
  const melhor = (pid, cid) => ts.filter(t => t.participante_id === pid && t.curso === cid).reduce((a, b) => !a || b.pontos > a.pontos ? b : a, null);
  const filtrados = todos.filter(p => (S.gestor.inativos || p.ativo !== false) && (!S.gestor.setor || p.setor === S.gestor.setor));
  const tsAtivos = ts.filter(t => ps.some(p => p.id === t.participante_id));
  const mediaAc = tsAtivos.length ? Math.round(tsAtivos.reduce((s, t) => s + t.acertos / t.total, 0) / tsAtivos.length * 100) : 0;
  const kpiCurso = CURSOS.map(c => {
    const fizeram = ps.filter(p => melhor(p.id, c.id)).length;
    const aprov = ps.filter(p => { const m = melhor(p.id, c.id); return m && m.acertos / m.total >= APROVACAO; }).length;
    return `<div class="kpi"><div class="k">${esc(c.curto || c.titulo)}</div><div class="v num">${aprov}<span style="font-size:16px;color:var(--muted)"> / ${ps.length}</span></div><div class="s">aprovados · ${fizeram} já fizeram</div></div>`;
  }).join('');
  const cel = (p, c) => {
    const m = melhor(p.id, c.id);
    if (!m) return `<span class="chip">Não fez</span>`;
    const ok = m.acertos / m.total >= APROVACAO;
    return `<span class="chip ${ok ? 'ok' : 'bad'} num">${ok ? 'Aprovado' : 'Reprovado'} · ${pct(m.acertos, m.total)}%</span>`;
  };
  const missHtml = CURSOS.map(c => {
    const st = new Map();
    ts.filter(t => t.curso === c.id).forEach(t => (t.respostas || []).forEach(r => { const s = st.get(r.q) || { n: 0, e: 0 }; s.n++; if (!r.ok) s.e++; st.set(r.q, s); }));
    const top = [...st.entries()].filter(([, s]) => s.e > 0).map(([id, s]) => ({ q: c.perguntas.find(x => x.id === id), ...s, taxa: s.e / s.n }))
      .filter(x => x.q).sort((a, b) => b.taxa - a.taxa || b.e - a.e).slice(0, 6);
    return `<div><p class="eyebrow" style="margin-bottom:6px">${esc(c.titulo)}</p><div class="rank-list" style="padding-block:4px">${top.length ? top.map(x => `<div class="miss-item"><div class="mq">${esc(x.q.p)}</div>
      <div class="miss-bar"><div class="track"><i style="width:${Math.round(x.taxa * 100)}%"></i></div><span class="num">${Math.round(x.taxa * 100)}% erram (${x.e}/${x.n})</span></div></div>`).join('') : `<p class="empty">Sem erros registrados ainda.</p>`}</div></div>`;
  }).join('');
  const setorOpts = sel => SETORES.map(s => `<option ${sel === s ? 'selected' : ''}>${esc(s)}</option>`).join('');
  $('#v-gestor').innerHTML = `<div class="wrap">
    <div class="hello"><div><h1>Painel do <span>gestor</span></h1><p>${ps.length} colaboradores ativos${inativos ? ` · ${inativos} desativado${inativos > 1 ? 's' : ''}` : ''} · ${ts.length} avaliações feitas</p></div>
      <div class="score-strip"><button class="btn btn-ghost" id="g-refresh">Atualizar</button><button class="btn btn-primary" id="g-csv">Baixar planilha (CSV)</button></div></div>

    <div class="sec-head"><h2 class="plate md">Cadastrar</h2></div>
    <form class="card cad-form" id="f-cad" autocomplete="off">
      <div class="field"><label for="cad-nome">Nome e sobrenome</label><input class="input" id="cad-nome" required></div>
      <div class="field"><label for="cad-setor">Setor</label><select class="input" id="cad-setor">${setorOpts(S.gestor.ultimoSetor || SETORES[0])}</select></div>
      <div class="field"><label for="cad-pin">PIN inicial</label><input class="input pin" id="cad-pin" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" required placeholder="0000"></div>
      <button class="btn btn-primary" type="submit">Cadastrar colaborador</button>
      <p class="form-err cad-msg" id="cad-msg" aria-live="polite"></p>
    </form>

    <div class="sec-head"><h2 class="plate md">Resumo</h2></div>
    <div class="kpis">
      <div class="kpi"><div class="k">Colaboradores</div><div class="v num">${ps.length}</div><div class="s">ativos na plataforma</div></div>
      <div class="kpi"><div class="k">Média de acertos</div><div class="v num">${mediaAc}%</div><div class="s">em ${tsAtivos.length} avaliações</div></div>
      ${kpiCurso}
    </div>
    <div class="sec-head"><h2 class="plate md">Equipe</h2></div>
    <div class="toolbar"><label for="g-setor" class="hint">Setor</label><select class="input" id="g-setor"><option value="">Todos</option>${SETORES.map(s => `<option ${S.gestor.setor === s ? 'selected' : ''}>${esc(s)}</option>`).join('')}</select>
      ${inativos ? `<label class="hint chk"><input type="checkbox" id="g-inativos" ${S.gestor.inativos ? 'checked' : ''}> Mostrar desativados</label>` : ''}</div>
    <div class="table-scroll"><table class="gt"><thead><tr><th>Nome</th><th>Setor</th>${CURSOS.map(c => `<th>${esc(c.curto || c.titulo)}</th>`).join('')}<th>Tentativas</th><th>Cadastro</th><th>Novo PIN</th><th>Acesso</th></tr></thead><tbody>
      ${filtrados.length ? filtrados.map(p => `<tr class="${p.ativo === false ? 'off' : ''}"><td class="nm">${esc(p.nome)}${p.ativo === false ? ' <span class="chip">Desativado</span>' : ''}</td>
        <td><select class="input sel-setor" data-pid="${esc(p.id)}" aria-label="Setor de ${esc(p.nome)}">${setorOpts(p.setor)}${SETORES.includes(p.setor) ? '' : `<option selected>${esc(p.setor)}</option>`}</select></td>
        ${CURSOS.map(c => `<td>${cel(p, c)}</td>`).join('')}
        <td class="num">${ts.filter(t => t.participante_id === p.id).length}</td><td class="num">${dataBR(p.criado_em)}</td>
        <td><form class="pinform" data-pid="${esc(p.id)}"><input class="input pin" id="pin-${esc(p.id)}" aria-label="Novo PIN de ${esc(p.nome)}" inputmode="numeric" maxlength="4" pattern="[0-9]{4}" placeholder="0000"><button class="btn btn-ghost btn-sm">Salvar</button></form></td>
        <td><button class="btn btn-ghost btn-sm btn-ativo" data-pid="${esc(p.id)}" data-ativo="${p.ativo === false ? '1' : '0'}">${p.ativo === false ? 'Reativar' : 'Desativar'}</button></td></tr>`).join('')
      : `<tr><td colspan="${6 + CURSOS.length}" class="empty">${todos.length ? 'Ninguém neste filtro.' : 'Nenhum colaborador cadastrado ainda. Use o formulário acima.'}</td></tr>`}
    </tbody></table></div>
    <div class="sec-head"><h2 class="plate md">Mais erradas</h2></div>
    <div class="miss">${missHtml}</div>
  </div>`;
  $('#g-setor').onchange = e => { S.gestor.setor = e.target.value; renderGestor(); };
  const ci = $('#g-inativos'); if (ci) ci.onchange = e => { S.gestor.inativos = e.target.checked; renderGestor(); };
  $('#g-refresh').onclick = () => recarregarPainel('Painel atualizado');
  $('#g-csv').onclick = () => baixarCsv(todos, ts, melhor);
  $('#f-cad').onsubmit = async ev => {
    ev.preventDefault(); const b = ev.target.querySelector('button'); b.disabled = true;
    const d = { nome: $('#cad-nome').value, setor: $('#cad-setor').value, pin: $('#cad-pin').value };
    try {
      const r = await api.cadastrar(d);
      S.gestor.ultimoSetor = d.setor;
      await recarregarPainel();
      const m = $('#cad-msg'); m.classList.add('ok');
      m.textContent = `${r.nome} cadastrado em ${r.setor}. Para entrar: nome “${r.nome}” e PIN ${d.pin}.`;
      $('#cad-nome').focus();
    } catch (e) { const m = $('#cad-msg'); m.classList.remove('ok'); m.textContent = e.message; }
    finally { b.disabled = false; }
  };
  $('#v-gestor').querySelectorAll('.sel-setor').forEach(sel => sel.onchange = async () => {
    try { await api.atualizar(sel.dataset.pid, sel.value, null); await recarregarPainel('Setor atualizado'); } catch (e) { toast(e.message); }
  });
  $('#v-gestor').querySelectorAll('.pinform').forEach(f => f.onsubmit = async ev => {
    ev.preventDefault(); const pin = f.querySelector('input').value;
    try { await api.redefinirPin(f.dataset.pid, pin); f.querySelector('input').value = ''; toast('PIN alterado. Avise o colaborador.'); }
    catch (e) { toast(e.message); }
  });
  $('#v-gestor').querySelectorAll('.btn-ativo').forEach(b => b.onclick = async () => {
    const reativar = b.dataset.ativo === '1';
    if (!reativar && !b.dataset.confirmar) {   // segundo clique confirma
      b.dataset.confirmar = '1'; b.textContent = 'Confirmar?'; b.classList.add('btn-red');
      setTimeout(() => { if (b.isConnected) { delete b.dataset.confirmar; b.textContent = 'Desativar'; b.classList.remove('btn-red'); } }, 4000);
      return;
    }
    try { await api.atualizar(b.dataset.pid, null, reativar); await recarregarPainel(reativar ? 'Acesso reativado' : 'Acesso desativado'); }
    catch (e) { toast(e.message); }
  });
}
function baixarCsv(ps, ts, melhor) {
  const linhas = [['Nome', 'Setor', 'Acesso', 'Cadastro', ...CURSOS.flatMap(c => [c.titulo + ' - melhor %', c.titulo + ' - pontos', c.titulo + ' - status']), 'Tentativas']];
  ps.forEach(p => linhas.push([p.nome, p.setor, p.ativo === false ? 'Desativado' : 'Ativo', dataBR(p.criado_em), ...CURSOS.flatMap(c => { const m = melhor(p.id, c.id); return m ? [pct(m.acertos, m.total), m.pontos, m.acertos / m.total >= APROVACAO ? 'Aprovado' : 'Reprovado'] : ['', '', 'Não fez']; }), ts.filter(t => t.participante_id === p.id).length]));
  const csv = '﻿' + linhas.map(l => l.map(v => `"${String(v).replace(/"/g, '""')}"`).join(';')).join('\r\n');
  if (window.claude?.use) {
    window.claude.use('downloads').then(dl => {
      if (dl) dl.save({ filename: 'academia-drive-notas.csv', data: new Blob([csv], { type: 'text/csv' }) }).catch(() => { });
      else toast('Download indisponível nesta visualização.');
    });
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  a.download = 'academia-drive-notas.csv'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

/* ------------------------------------------------------------- início */
document.addEventListener('click', e => {
  if (e.target.closest('#btn-sair')) logout();
  if (e.target.closest('#btn-sair-gestor')) sairDoGestor();
  if (e.target.closest('#btn-voltar-gestor')) { S.gestor = null; if (S.user) goHome(); else { renderLogin(); show('login'); } }
  if (e.target.closest('#brand')) { if (S.user && S.view !== 'quiz') goHome(); }
});
(function boot() {
  const logo = new Image();
  logo.onload = () => document.documentElement.classList.add('tem-logo');
  logo.src = 'assets/logo.png';
  if (MODO_DEMO) $('#demo-bar').hidden = false;
  if (S.user) goHome(); else { renderLogin(); show('login'); }
})();

</script>
